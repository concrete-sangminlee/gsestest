[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gses-notice-bot"
description = "서울대학교 환경대학원(gses.snu.ac.kr) 게시판 새 글 Slack 알림 봇"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gses-bot = "gses_bot.cli:main"

[tool.setuptools]
packages = ["gses_bot"]

[tool.setuptools.dynamic]
version = { attr = "gses_bot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 한국어 문자열/주석의 전각 문자(·, ｜ 등)는 의도된 것입니다.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gses_bot"]
known-local-folder = ["conftest"]
